<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LED Grand Line">
  <defs>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5CC8FF" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#5CC8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="11" fill="#000"/>
  <rect x=".5" y=".5" width="63" height="63" rx="10.5" fill="none" stroke="#1E6FD9" stroke-opacity=".55"/>
  <circle cx="32" cy="32" r="30" fill="url(#halo)"/>
  <g filter="url(#glow)">
    <g fill="#BFE6FF">
      <circle cx="18" cy="18" r="3.4"/>
      <circle cx="32" cy="18" r="3.4" fill="#FFFFFF"/>
      <circle cx="46" cy="18" r="3.4"/>
      <circle cx="18" cy="32" r="3.4"/>
      <circle cx="46" cy="32" r="3.4" fill="#FFFFFF"/>
      <circle cx="18" cy="46" r="3.4"/>
      <circle cx="32" cy="46" r="3.4"/>
    </g>
    <g fill="#1E6FD9" opacity=".7">
      <circle cx="32" cy="32" r="2.2"/>
      <circle cx="46" cy="46" r="2.2"/>
    </g>
  </g>
</svg>
