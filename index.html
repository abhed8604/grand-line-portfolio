<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A personal portfolio told through ice-blue LED particles." />
    <meta property="og:title" content="LED Grand Line" />
    <meta property="og:description" content="A personal portfolio told through ice-blue LED particles." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LED Grand Line" />
    <meta name="twitter:description" content="A personal portfolio told through ice-blue LED particles." />
    <meta name="twitter:image" content="./og.png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>LED Grand Line</title>
  </head>
  <body class="is-loading">
    <a class="skip-link" href="#quickview" data-open-quick>Skip to full portfolio text</a>

    <div id="app">
      <canvas id="led-canvas" aria-hidden="true"></canvas>

      <div class="atmosphere" aria-hidden="true">
        <div class="atmosphere__grid"></div>
        <div class="atmosphere__vignette"></div>
        <div class="atmosphere__scan"></div>
        <div class="atmosphere__reticle atmosphere__reticle--tl"></div>
        <div class="atmosphere__reticle atmosphere__reticle--br"></div>
      </div>

      <header id="site-header" class="site-header"></header>

      <div id="fallback-note" class="fallback-note" hidden></div>

      <div id="stage-root" class="stage-root" aria-label="Portfolio story"></div>
      <div id="scroll-track" class="scroll-track" aria-hidden="true"></div>

      <div id="mobile-flow" class="mobile-flow"></div>

      <nav id="nav-rail" class="nav-rail" aria-label="Portfolio sections"></nav>

      <aside id="telemetry" class="telemetry" aria-label="Particle engine status"></aside>

      <footer id="site-footer" class="site-footer"></footer>

      <div id="loader" class="loader" role="status" aria-live="polite"></div>

      <dialog id="quickview" class="quickview" aria-labelledby="quickview-title"></dialog>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="tap-layer" class="tap-layer" aria-hidden="true"></div>
      <div id="accessible-content" class="sr-only" role="region" aria-label="Full portfolio content, text edition"></div>

    </div>

    <noscript>
      <div class="noscript">This particle portfolio needs JavaScript. The résumé PDF is available at <a href="./resume.pdf">/resume.pdf</a>.</div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
